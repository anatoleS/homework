plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.5'
}

group = 'ru.otus.anatoly'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation "io.grpc:grpc-netty:1.75.0"
    implementation "io.grpc:grpc-protobuf:1.75.0"
    implementation "io.grpc:grpc-stub:1.75.0"
    implementation "com.google.protobuf:protobuf-java:4.32.1"
    implementation 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.5'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

test {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.32.1"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.75.0"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {
                outputSubDir = "grpc"
            }
        }
    }
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Run gRPC server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.otus.numbers.server.ServerMain'
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Run gRPC client'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.otus.numbers.client.ClientMain'
    args = project.findProperty('clientArgs')?.toString()?.split(' ') ?: []
}
