plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
    }
}

group = 'ru.otus.anatoly'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway:4.1.1'
    implementation 'io.r2dbc:r2dbc-postgresql:0.8.13.RELEASE'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'org.flywaydb:flyway-core:13.10.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.10.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
