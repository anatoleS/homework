plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ru.otus.anatoly'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway:4.1.1'
    implementation 'org.flywaydb:flyway-core:13.10.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.10.0'
    implementation 'org.postgresql:postgresql:42.7.14'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation platform('org.junit:junit-bom:6.1.3')
}

test {
    useJUnitPlatform()
}