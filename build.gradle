plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.4.0'
    id 'com.bmuschko.docker-remote-api' version '10.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'ru.otus.anatoly.Main'
}

group = 'ru.otus.anatoly'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:6.0.0")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation project(':hw01-gradle')
    implementation project(':hw04-collections')
    implementation project(':hw06-reflection')
    implementation project(':hw08-gc')
    implementation project(':hw10-bytecode')

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}

shadowJar {
    archiveClassifier.set('fat')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'ru.otus.anatoly.Main'
    }
}

// Сборка Docker-образа (jar + sweep.sh) через Docker API, без CLI.
// Запуск: gradle dockerBuildImage
import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage

tasks.register('dockerBuildImage', DockerBuildImage) {
    inputDir.set(file('.'))
    dockerFile.set(file('hw08-gc/Dockerfile'))
    images.add("otus-hw08-gc:latest")
    dependsOn shadowJar
}

tasks.named('jar') {
    dependsOn shadowJar
}

test {
    useJUnitPlatform()
}
