plugins {
    id 'java'
}

group = 'ru.otus.anatoly'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation("org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.13")
    implementation("org.eclipse.jetty:jetty-server:12.1.13")
    implementation("org.eclipse.jetty.ee10:jetty-ee10-webapp:12.1.13")
    implementation("org.eclipse.jetty:jetty-security:12.1.13")
    implementation("org.eclipse.jetty:jetty-http:12.1.13")
    implementation("org.eclipse.jetty:jetty-io:12.1.13")
    implementation("org.eclipse.jetty:jetty-util:12.1.13")

    implementation("org.freemarker:freemarker:2.3.35")

    // JSON + hw21-jpql
    implementation("com.google.code.gson:gson:2.14.0")
    implementation project(':hw21-jpql')

    // Hibernate and flyway for direct use in Main
    implementation("org.hibernate.orm:hibernate-core:7.4.12.Final")
    implementation("org.flywaydb:flyway-core:13.10.0")
    implementation("org.flywaydb:flyway-database-postgresql:13.10.0")
    implementation("org.postgresql:postgresql:42.7.14")
    implementation("jakarta.persistence:jakarta.persistence-api:3.2.0")

    // Логирование и тесты
    implementation("ch.qos.logback:logback-classic:1.6.3")
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

}

test {
    useJUnitPlatform()
}

// Настройка запуска для hw24-webserver
application {
    mainClass = 'ru.otus.webserver.MainWebServer'
}
